<div class="form-page">

  <div class="back-btn-wrap">
    <button pButton icon="pi pi-arrow-left" label="Back" (click)="goBack()" class="back-btn"></button>
  </div>

  <div class="table-card">
    <div class="page-header settlement-header">
      <h2>Claim Settlement</h2>
    </div>
    <div class="info-chips plain-chips">
      <div *ngFor="let f of claimHeaderFields()" class="chip">
        <span class="chip-label">
          {{ f.FIELD_PROMPT }}
          <span class="required" *ngIf="f.MANDATORY === 1">*</span>
        </span>

        <input *ngIf="f.INPUT_TYPE === 'text'"
          type="text"
          [(ngModel)]="claimHeaderData()[f.COLUMN_NAME]"
          [name]="f.COLUMN_NAME"
          class="chip-input" />

        <p-datepicker *ngIf="f.INPUT_TYPE === 'date'"
          [(ngModel)]="claimHeaderData()[f.COLUMN_NAME]"
          [name]="f.COLUMN_NAME"
          dateFormat="dd/mm/yy" [showTime]="true" hourFormat="24" [showIcon]="true" [readonlyInput]="true"
          styleClass="chip-input"></p-datepicker>

        <label *ngIf="f.INPUT_TYPE === 'checkbox'" class="chip-checkbox-label">
          <input type="checkbox"
            [(ngModel)]="claimHeaderData()[f.COLUMN_NAME]"
            [name]="f.COLUMN_NAME" />
        </label>

        <span *ngIf="!f.INPUT_TYPE" class="chip-value">
          {{ claimHeaderData()[f.COLUMN_NAME] }}
        </span>
      </div>
    </div>
  </div>

  <div class="table-card risk-table-card">
    <div class="page-header settlement-header">
      <h2>Risk Details</h2>
    </div>
    <div *ngIf="riskLoading()" class="state-msg">Loading risk table...</div>
    <table *ngIf="!riskLoading()" class="risk-grid">
      <thead>
        <tr>
          <th>#</th>
          <th *ngFor="let col of extraColumns">
  {{ col.FIELD_PROMPT }}
  <span class="required" *ngIf="col.MANDATORY === 1">*</span>
</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of riskGridRows(); let i = index">
          <td>{{ i + 1 }}</td>
          <td *ngFor="let col of riskTableColumns()">
            <ng-container [ngSwitch]="getInputType(col.SOURCE_DESIGN_TYPE, col.DATA_TYPE)">
              <input *ngSwitchCase="'checkbox'" type="checkbox"
                [ngModel]="row[col.COLUMN_NAME]" [name]="'risk_' + col.COLUMN_NAME + i" disabled />
              <p-datepicker *ngSwitchCase="'date'" [ngModel]="row[col.COLUMN_NAME]" [name]="'risk_' + col.COLUMN_NAME + i"
                dateFormat="dd/mm/yy" [showTime]="true" hourFormat="24" [showIcon]="true" [readonlyInput]="true"
                [disabled]="true"></p-datepicker>
              <input *ngSwitchDefault type="text"
                [ngModel]="row[col.COLUMN_NAME]" [name]="'risk_' + col.COLUMN_NAME + i" readonly disabled />
            </ng-container>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="table-card">
    <div class="page-header settlement-header1">
      <h2 class="settlement-title">Settlement Details</h2>
      <div class="header-actions">
        <button pButton label="+ Add Row" (click)="addRow()" class="add-row-btn"></button>
      </div>
    </div>
    <div *ngIf="loading()" class="state-msg">Loading table...</div>

    <table *ngIf="!loading()" class="risk-grid">
      <thead>
        <tr>
          <th>#</th>
          <th *ngFor="let col of visibleColumns">{{ col.FIELD_PROMPT }}</th>
          <th *ngIf="extraColumns.length > 0"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of gridRows(); let i = index">
          <td>{{ i + 1 }}</td>

          <!-- REPLACED: was <input type="text"> -->
          <td *ngFor="let col of visibleColumns">
            <ng-container [ngSwitch]="getInputType(col.SOURCE_DESIGN_TYPE, col.DATA_TYPE)">
              <input *ngSwitchCase="'checkbox'" type="checkbox"
                [(ngModel)]="row[col.COLUMN_NAME]" [name]="col.COLUMN_NAME + i" />
              <p-datepicker *ngSwitchCase="'date'" [(ngModel)]="row[col.COLUMN_NAME]" [name]="col.COLUMN_NAME + i"
                dateFormat="dd/mm/yy" [showTime]="true" hourFormat="24" [showIcon]="true" [readonlyInput]="true"></p-datepicker>
              <input *ngSwitchDefault type="text"
                [(ngModel)]="row[col.COLUMN_NAME]" [name]="col.COLUMN_NAME + i" />
            </ng-container>
          </td>
          <!-- END REPLACEMENT -->

          <td *ngIf="extraColumns.length > 0">
            <button pButton icon="pi pi-save" class="p-button-text p-button-rounded" (click)="saveRow(i)"></button>
            <button pButton label="More" icon="pi pi-external-link" (click)="openMoreDialog(i)" class="more-btn"></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<p-dialog [(visible)]="showMoreDialogValue" [modal]="true" [style]="{ width: '90vw', maxWidth: '900px' }"
  [header]="'More Details — Row ' + ((activeRowIndex() ?? 0) + 1)">
  <table class="risk-grid" *ngIf="activeRowIndex() !== null">
    <thead>
      <tr>
        <th *ngFor="let col of extraColumns">
  {{ col.FIELD_PROMPT }}
  <span class="required" *ngIf="col.MANDATORY === 1">*</span>
</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <!-- REPLACED: was <input type="text"> -->
        <td *ngFor="let col of extraColumns">
          <ng-container [ngSwitch]="getInputType(col.SOURCE_DESIGN_TYPE, col.DATA_TYPE)">
            <input *ngSwitchCase="'checkbox'" type="checkbox"
              [(ngModel)]="gridRows()[activeRowIndex()!][col.COLUMN_NAME]" [name]="'extra_' + col.COLUMN_NAME" />
            <p-datepicker *ngSwitchCase="'date'" [(ngModel)]="gridRows()[activeRowIndex()!][col.COLUMN_NAME]" [name]="'extra_' + col.COLUMN_NAME"
              dateFormat="dd/mm/yy" [showTime]="true" hourFormat="24" [showIcon]="true" [readonlyInput]="true"></p-datepicker>
            <input *ngSwitchDefault type="text"
              [(ngModel)]="gridRows()[activeRowIndex()!][col.COLUMN_NAME]" [name]="'extra_' + col.COLUMN_NAME" />
          </ng-container>
        </td>
        <!-- END REPLACEMENT -->
      </tr>
    </tbody>
  </table>
</p-dialog>
