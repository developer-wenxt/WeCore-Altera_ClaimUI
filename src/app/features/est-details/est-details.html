<div class="form-page">
  <div class="page-header est-header">                     <!-- CHANGED -->
    <button pButton icon="pi pi-arrow-left" label="Back" (click)="goBack()" class="back-btn"></button>
    <h2 class="est-title">Estimation Details</h2>            <!-- CHANGED — added class -->
    <div class="header-actions">                             <!-- ADD -->
      <button pButton label="+ Add Row" (click)="addRow()" class="add-row-btn"></button>   <!-- MOVED here -->
    </div>
  </div>

  <div class="table-card">
   

    <div *ngIf="loading()" class="state-msg">Loading table...</div>

    <table *ngIf="!loading()" class="risk-grid">
      <thead>
        <tr>
          <th>#</th>
          <th *ngFor="let col of visibleColumns">{{ col.FIELD_PROMPT }}</th>
          <th *ngIf="extraColumns.length > 0"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of gridRows(); let i = index">
          <td>{{ i + 1 }}</td>
          <td *ngFor="let col of visibleColumns">
            <input type="text" [(ngModel)]="row[col.COLUMN_NAME]" [name]="col.COLUMN_NAME + i" [disabled]="!isFieldEditable(col)" />
          </td>
          <td *ngIf="extraColumns.length > 0">
            <button pButton icon="pi pi-save" class="p-button-text p-button-rounded" (click)="saveRow(i)"></button>
            <button pButton label="More" icon="pi pi-external-link" (click)="openMoreDialog(i)" class="more-btn"></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<p-dialog [(visible)]="showMoreDialogValue" [modal]="true" [style]="{ width: '90vw', maxWidth: '900px' }" [header]="'More Details — Row ' + ((activeRowIndex() ?? 0) + 1)">
  <table class="risk-grid" *ngIf="activeRowIndex() !== null">
    <thead>
      <tr>
        <th *ngFor="let col of extraColumns">{{ col.FIELD_PROMPT }}</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td *ngFor="let col of extraColumns">
          <input type="text" [(ngModel)]="gridRows()[activeRowIndex()!][col.COLUMN_NAME]" [name]="'extra_' + col.COLUMN_NAME" [disabled]="!isFieldEditable(col)" />
        </td>
      </tr>
    </tbody>
  </table>
</p-dialog>
