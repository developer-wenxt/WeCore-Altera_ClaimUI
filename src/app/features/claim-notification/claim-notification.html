<div class="form-page">
  <div class="table-card">
    <div class="page-header claim-notif-header">        
      <div class="header-left">
        <button pButton icon="pi pi-arrow-left" label="Back" (click)="goBack()" class="back-btn"></button>
      </div>
      <h2 class="claim-notif-title">Claim Notification</h2>   
    </div>

    <div class="info-chips">
      <div class="chip">
        <span class="chip-label">Product</span>
        <span class="chip-value">2001</span>
      </div>

      <div class="chip highlight">
        <span class="chip-label">Type</span>
        <span class="chip-value">Intimation</span>
      </div>
    </div>

    <div *ngIf="loading()" class="state-msg">
      Loading form...
    </div>

    <form *ngIf="!loading()" class="dynamic-form-grid">

      <div
        *ngFor="let field of fields()"
        class="form-field"
        [class.checkbox-field]="getInputType(field.SOURCE_DESIGN_TYPE) === 'checkbox'">

        <label *ngIf="getInputType(field.SOURCE_DESIGN_TYPE) !== 'checkbox'">
          {{ field.FIELD_PROMPT }}
          <span class="required" *ngIf="field.MANDATORY === 1">*</span>
        </label>

        <ng-container [ngSwitch]="getInputType(field.SOURCE_DESIGN_TYPE)">

          <!-- Checkbox -->
          <label *ngSwitchCase="'checkbox'" class="checkbox-label">
            <input
              type="checkbox"
              [(ngModel)]="formData[field.COLUMN_NAME]"
              [name]="field.COLUMN_NAME"
              [disabled]="isReadOnly || !isFieldEditable(field)"
              [ngModelOptions]="{standalone: true}" />
            <span>{{ field.FIELD_PROMPT }}</span>
          </label>

          <!-- Date -->
          <input
            *ngSwitchCase="'date'"
            pInputText
            type="datetime-local"
            [(ngModel)]="formData[field.COLUMN_NAME]"
            [name]="field.COLUMN_NAME"
            [readonly]="isReadOnly || !isFieldEditable(field)"
            [ngModelOptions]="{standalone: true}" />

          <!-- Number -->
          <input
            *ngSwitchCase="'number'"
            pInputText
            type="number"
            [attr.placeholder]="field.TOOL_TIP"
            [(ngModel)]="formData[field.COLUMN_NAME]"
            [name]="field.COLUMN_NAME"
            [readonly]="isReadOnly || !isFieldEditable(field)"
            [ngModelOptions]="{standalone: true}" />

          <!-- Text / LOV dropdown -->
          <ng-container *ngSwitchDefault>

          <p-select
  *ngIf="isLovField(field.COLUMN_NAME); else textInput"
  [options]="getDropdownOptions(field.COLUMN_NAME)"
  [(ngModel)]="formData[field.COLUMN_NAME]"
  optionLabel="label"
  optionValue="value"
  [name]="field.COLUMN_NAME"
  [disabled]="isReadOnly || !isFieldEditable(field)"
  [ngModelOptions]="{standalone: true}"
  placeholder="-- Select --">
</p-select>

            <ng-template #textInput>
              <input
                pInputText
                type="text"
                [attr.placeholder]="field.TOOL_TIP"
                [(ngModel)]="formData[field.COLUMN_NAME]"
                [name]="field.COLUMN_NAME"
                [readonly]="isReadOnly || !isFieldEditable(field)"
                [ngModelOptions]="{standalone: true}" />
            </ng-template>

          </ng-container>

        </ng-container>

      </div>

    </form>

    <div class="form-actions" *ngIf="!loading() && !isReadOnly">
      <button
        pButton
        type="button"
        label="Submit"
        class="submit-btn"
        (click)="saveClaim()">
      </button>
    </div>

  </div>
</div>
